name: rolepilot
services:
  app:
    image: rolepilot:theme-switch-local
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - data:/data
    mem_limit: 1g
volumes:
  data:
    # Existing storage identity is retained so the rebrand cannot select an empty volume.
    external: true
    name: dossier_data
