# rolepilot with Docker Compose (see the installation guide, /help). Save this
# file as compose.yml in a folder of its own, put POSTGRES_PASSWORD,
# ROLEPILOT_PASSWORD (a hash of your password, from `docker run --rm -it
# rolepilot hash-password`) and ROLEPILOT_SECRET in a .env file
# next to it, then:
#
#   docker compose up -d
#
# Add COMPOSE_PROFILES=ai to .env to run Ollama for a local model as well.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rolepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rolepilot
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolepilot -d rolepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${ROLEPILOT_IMAGE:-rolepilot:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rolepilot:${POSTGRES_PASSWORD}@db:5432/rolepilot
      ROLEPILOT_PASSWORD: ${ROLEPILOT_PASSWORD:?Set ROLEPILOT_PASSWORD in .env to a hash from hash-password}
      ROLEPILOT_SECRET: ${ROLEPILOT_SECRET:?Set ROLEPILOT_SECRET in .env}
      ROLEPILOT_BACKUP_RETENTION_DAYS: ${ROLEPILOT_BACKUP_RETENTION_DAYS:-}
      # Your time zone, e.g. Europe/Berlin: nightly backups run at 03:00 in it.
      TZ: ${TZ:-UTC}
      ROLEPILOT_AI_PROVIDER: ${ROLEPILOT_AI_PROVIDER:-}
      ROLEPILOT_AI_URL: ${ROLEPILOT_AI_URL:-}
      ROLEPILOT_AI_MODEL: ${ROLEPILOT_AI_MODEL:-}
      ROLEPILOT_AI_KEY: ${ROLEPILOT_AI_KEY:-}
      ROLEPILOT_AI_TIMEOUT_SECONDS: ${ROLEPILOT_AI_TIMEOUT_SECONDS:-}
      # The daily usage ping: unset, rolepilot asks after sign-in; on or off answers in advance (see Privacy in the wiki).
      # Defaults for Settings → Job search.
      ROLEPILOT_JOBS_SOURCE: ${ROLEPILOT_JOBS_SOURCE:-}
      ROLEPILOT_JSEARCH_KEY: ${ROLEPILOT_JSEARCH_KEY:-}
      ROLEPILOT_JSEARCH_HOST: ${ROLEPILOT_JSEARCH_HOST:-}
      ROLEPILOT_ADZUNA_APP_ID: ${ROLEPILOT_ADZUNA_APP_ID:-}
      ROLEPILOT_ADZUNA_KEY: ${ROLEPILOT_ADZUNA_KEY:-}
      ROLEPILOT_FREEHIRE_URL: ${ROLEPILOT_FREEHIRE_URL:-}
      ROLEPILOT_JOBS_ARBEITSAGENTUR: ${ROLEPILOT_JOBS_ARBEITSAGENTUR:-}
      # Defaults for Settings → Scoring: ai or jev (Jev by TypeSafe, with its key).
      ROLEPILOT_SCORER: ${ROLEPILOT_SCORER:-}
      ROLEPILOT_TYPESAFE_KEY: ${ROLEPILOT_TYPESAFE_KEY:-}
      # Gmail and Calendar: a Google OAuth client (or enter it in Settings → Google).
      ROLEPILOT_GOOGLE_CLIENT_ID: ${ROLEPILOT_GOOGLE_CLIENT_ID:-}
      ROLEPILOT_GOOGLE_CLIENT_SECRET: ${ROLEPILOT_GOOGLE_CLIENT_SECRET:-}
      # The address rolepilot is reached at, for Google's redirect.
      ROLEPILOT_PUBLIC_URL: ${ROLEPILOT_PUBLIC_URL:-}
    # Only on the server itself: put a reverse proxy with HTTPS in front.
    ports:
      - "127.0.0.1:${ROLEPILOT_PORT:-3000}:3000"
    volumes:
      - data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g
    # Lets http://host.docker.internal reach Ollama (:11434) or LM Studio
    # (:1234) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # A local model, with COMPOSE_PROFILES=ai in .env: `docker compose up -d`,
  # then pull one (see "Choosing an AI provider" in the wiki). rolepilot reaches it at http://ollama:11434.
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  data:
  ollama:
